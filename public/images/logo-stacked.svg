    <rect x="109" y="0" width="100" height="100" fill="#18181A"/>
    <rect x="218" y="0" width="100" height="100" fill="#DD1B24"/>
    <g fill="#FFFFFF" font-family="Georgia, 'Times New Roman', 'PT Serif', serif" font-weight="700" font-size="74" text-anchor="middle">
      <text x="50"  y="72">P</text>
