<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 120" width="700" height="120" role="img" aria-label="Pleasant Personality Academy">
  <!-- PPA squares mark (white square replaces black for dark backgrounds) -->
  <g transform="translate(0,18)">
    <rect x="0"   y="0" width="84" height="84" fill="#DD1B24"/>
    <rect x="92"  y="0" width="84" height="84" fill="#FFFFFF"/>
    <rect x="184" y="0" width="84" height="84" fill="#DD1B24"/>
    <g font-family="Georgia, 'Times New Roman', 'PT Serif', serif" font-weight="700" font-size="62" text-anchor="middle">
      <text x="42"  y="61" fill="#FFFFFF">P</text>
      <text x="134" y="61" fill="#18181A">P</text>
      <text x="226" y="61" fill="#FFFFFF">A</text>
    </g>
  </g>
  <!-- wordmark -->
  <g font-family="Georgia, 'Times New Roman', 'PT Serif', serif">
    <text x="300" y="57" font-size="36" font-weight="700" fill="#FFFAF3">Pleasant Personality</text>
    <text x="302" y="89" font-size="20" letter-spacing="7" fill="#F2B6B8">ACADEMY</text>
  </g>
</svg>
